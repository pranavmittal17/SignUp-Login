# name of application
spring.application.name=springbootproject 


#Instead of getting an extremely generic response, these settings can make error information more visible.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#this is the database I want to connect to
spring.datasource.url=jdbc:mysql://localhost:3306/registration
spring.datasource.username=root
spring.datasource.password=root

# tells hibernate what to do regarding your database schema
spring.jpa.hibernate.ddl-auto=update

#this will show the sql properties
# spring.jpa.show-sql=true


# spring.jpa.properties.hibernate.format_sql=true

# # Use JWT_SECRET in deployed environments; the fallback is for local development only.
# jwt.secret=${JWT_SECRET:dev-only-signing-secret-change-me-please-32bytes}

jwt.secret=MySuperSecretKeyForJWTAuthentication123456789

session.idle-timeout-minutes=30